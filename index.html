<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Zion AI Call Analytics</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%;padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📞 Zion AI Call Analytics</h1><p>Paste a call transcript excerpt for instant VoC analysis.</p><textarea id="t" rows="5" placeholder="Customer: I've been waiting two weeks for a resolution..."></textarea><br><button onclick="go()">Analyze</button><div id="out"></div><script>function go(){const t=document.getElementById('t').value.toLowerCase();const topics=[];if(/wait|delay|slow/.test(t))topics.push('Wait time');if(/price|cost|billing|charge/.test(t))topics.push('Billing');if(/broken|fail|error|down/.test(t))topics.push('Technical issue');if(/cancel|refund|leave/.test(t))topics.push('⚠️ Churn risk');const neg=/frustrat|angry|unhappy|disappoint|terrible|waiting/.test(t);document.getElementById('out').textContent=`Sentiment: ${neg?'😠 Negative — escalation recommended':'🙂 Neutral/Positive'}\nTopics: ${topics.join(', ')||'General inquiry'}\n${/cancel|refund|leave/.test(t)?'🔴 Churn signal detected → route to retention playbook\n':''}\nFull call analytics platform: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/zion-ai-call-analytics">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-sales-call-analyst/">Sales Call Analyst</a></p></body></html>
